[package]
name = "githydra-desktop"
version = "0.6.0"
description = "GitHydra desktop shell"
authors = ["GitHydra"]
edition = "2024"
publish = false

[lib]
name = "githydra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
git2 = { version = "0.20", default-features = false, features = ["https", "ssh"] }
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
